<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Le figure di salsa e bachata, divise per stile, con video su YouTube." />
    <meta name="theme-color" content="#f6f7f8" />
    <script>
      if (window.location.search.startsWith('?/')) {
        const route = window.location.search.slice(2).replace(/~and~/g, '&')
        window.history.replaceState(null, '', `/${route}${window.location.hash}`)
      } else if (window.location.hash.startsWith('#/')) {
        window.history.replaceState(null, '', `/${window.location.hash.slice(2)}`)
      }
    </script>
    <link rel="icon" href="/pwa-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&family=Caveat:wght@600;700&display=swap" rel="stylesheet" />
    <title>Salsa & Bachata · Figure</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
